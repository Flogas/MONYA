version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: askue-postgres
    restart: always
    environment:
      POSTGRES_DB: askue
      POSTGRES_USER: askue
      POSTGRES_PASSWORD: askue123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: askue-backend
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  meter:
    build: ./meter
    container_name: askue-meter
    restart: always
    env_file: .env
    depends_on:
      - backend

volumes:
  postgres_data: